name: "Build and publish desktop (Alpha)"

on:
  push:
    branches:
      - develop
    paths:
      - "desktop/**"
      - "distribution/debian/**"
      - "distribution/flatpak/**"
      - "distribution/rpm/**"
      - "scripts/distro/**"
      - ".github/workflows/client-alpha.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that publish override it.
permissions:
  contents: read

jobs:
  build-and-publish-alpha:
    name: Build and publish Alpha .deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      alpha_version: ${{ steps.version.outputs.alpha_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup@v6
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust nightly
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: compute alpha version
        id: version
        run: |
          BASE_VERSION=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ALPHA_VERSION="${BASE_VERSION}-alpha.${{ github.run_number }}.${SHORT_SHA}"
          echo "alpha_version=${ALPHA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Alpha version: ${ALPHA_VERSION}"

          # Update version in tauri.conf.json so the binary and deb are stamped with the alpha version
          jq --arg v "$ALPHA_VERSION" '.version = $v' desktop/src-tauri/tauri.conf.json > desktop/src-tauri/tauri.conf.json.tmp
          mv desktop/src-tauri/tauri.conf.json.tmp desktop/src-tauri/tauri.conf.json

      - name: install frontend dependencies
        run: pnpm install

      - name: build Tauri debian bundle
        run: |
          pnpm --filter drop-app exec tauri build --bundles deb

      - name: stage deb asset
        id: deb
        env:
          ALPHA_VERSION: ${{ steps.version.outputs.alpha_version }}
        run: |
          DEB_PATH=$(find desktop/src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          [ -f "$DEB_PATH" ] || { echo "Debian package not found" >&2; exit 1; }
          TARGET_NAME="Drop.Desktop.Client_${ALPHA_VERSION}_amd64.deb"
          cp "$DEB_PATH" "$TARGET_NAME"
          echo "deb_path=${TARGET_NAME}" >> "$GITHUB_OUTPUT"
          echo "deb_name=${TARGET_NAME}" >> "$GITHUB_OUTPUT"
          ls -la "$TARGET_NAME"

      - name: upload alpha deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: drop-alpha-deb
          path: ${{ steps.deb.outputs.deb_path }}
          if-no-files-found: error
          retention-days: 7

      - name: publish to rolling 'alpha' GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALPHA_VERSION: ${{ steps.version.outputs.alpha_version }}
          DEB_PATH: ${{ steps.deb.outputs.deb_path }}
        run: |
          tag="alpha"
          title="Drop Alpha (${ALPHA_VERSION})"
          notes="Automated alpha build from commit ${{ github.sha }} on develop."

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Creating new release $tag"
            gh release create "$tag" "$DEB_PATH" \
              --title "$title" --notes "$notes" --prerelease --target "${{ github.sha }}"
          else
            echo "Updating existing release $tag"
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease --target "${{ github.sha }}"
            gh release upload "$tag" "$DEB_PATH" --clobber
          fi

      - name: Trigger FlatPark Alpha Release Webhook
        uses: flatpark/publish-action@b67fca1b80b095541bc011967e0a35292bed14d8 # v1
        continue-on-error: true # Non-blocking until PR #344 is merged on FlatPark
        with:
          app-id: org.droposs.client.Alpha
          tag: alpha

  ppa-alpha:
    name: Publish Alpha to Ubuntu PPA
    needs: [build-and-publish-alpha]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      PPA_ALPHA: ${{ vars.PPA_ALPHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: download alpha deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8
        with:
          name: drop-alpha-deb
          path: dist/deb

      - name: prepare PPA source
        id: ppa
        env:
          ALPHA_VERSION: ${{ needs.build-and-publish-alpha.outputs.alpha_version }}
        run: |
          set -euo pipefail
          deb="$(find dist/deb -maxdepth 1 -name '*_amd64.deb' -print -quit)"
          [ -n "$deb" ] || { echo "no alpha deb artifact found" >&2; exit 1; }
          scripts/distro/prepare-ppa-source.sh \
            --channel alpha \
            --version "$ALPHA_VERSION" \
            --deb "$deb" \
            --outdir dist/ppa >> "$GITHUB_OUTPUT"

      - name: publish to Launchpad PPA
        uses: yuezk/publish-ppa-package@3e4da8d50b48950e8a84cd4302f031a17b5bfd27 # v2.0.1
        with:
          repository: ${{ env.PPA_ALPHA }}
          series: "jammy noble"
          revision: "0"
          include_orig: auto
          debmake_arguments: "-y"
          new_version_template: "{VERSION}-{REVISION}~ubuntu{SERIES_VERSION}.1"
          tarball: ${{ steps.ppa.outputs.tarball }}
          debian_dir: ${{ steps.ppa.outputs.debian_dir }}
          deb_email: contact@heretek.games
          deb_fullname: Heretek Games
          gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}

  copr-alpha:
    name: Publish Alpha to Fedora COPR
    needs: [build-and-publish-alpha]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      COPR_ALPHA: ${{ vars.COPR_ALPHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: download alpha deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8
        with:
          name: drop-alpha-deb
          path: dist/deb

      - name: extract client binary
        run: |
          set -euo pipefail
          deb="$(find dist/deb -maxdepth 1 -name '*_amd64.deb' -print -quit)"
          [ -n "$deb" ] || { echo "no alpha deb artifact found" >&2; exit 1; }
          mkdir -p dist/bin
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/bin/drop-app > dist/bin/drop-app
          chmod +x dist/bin/drop-app

      - name: build SRPM and submit to COPR
        env:
          COPR_CONFIG_B64: ${{ secrets.COPR_API_TOKEN_CONFIG }}
          ALPHA_VERSION: ${{ needs.build-and-publish-alpha.outputs.alpha_version }}
        run: |
          set -euo pipefail
          : "${COPR_ALPHA:?COPR_ALPHA repository variable is not set}"
          : "${COPR_CONFIG_B64:?COPR_API_TOKEN_CONFIG secret is not set}"
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e ALPHA_VERSION \
            -e COPR_ALPHA \
            -e COPR_CONFIG_B64 \
            fedora:41 bash -euo pipefail -c '
              dnf install -y --setopt=install_weak_deps=False rpm-build copr-cli tar gzip findutils >/dev/null
              mkdir -p /root/.config
              printf "%s" "$COPR_CONFIG_B64" | base64 -d > /root/.config/copr
              chmod 600 /root/.config/copr
              scripts/distro/build-rpm-srpm.sh \
                --channel alpha \
                --version "$ALPHA_VERSION" \
                --binary /work/dist/bin/drop-app \
                --outdir /work/dist/rpm
              srpm="$(find /work/dist/rpm -maxdepth 1 -name "*.src.rpm" -print -quit)"
              copr-cli build "$COPR_ALPHA" "$srpm"
            '
