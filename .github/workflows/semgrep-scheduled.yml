name: Semgrep (scheduled)

# Deep security scan on a weekly schedule — deliberately not wired into git
# hooks or push/PR CI, where its runtime would be too disruptive.
on:
  schedule:
    - cron: "30 5 * * 1" # weekly Monday 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      # Pinned by tag + manifest digest; bump both together.
      image: semgrep/semgrep:latest@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan
        run: |
          semgrep scan --config p/default --sarif --output semgrep.sarif
          python3 -c '
          import json
          with open("semgrep.sarif", "r") as f:
              data = json.load(f)
          for run in data.get("runs", []):
              run["results"] = [
                  r for r in run.get("results", [])
                  if not (r.get("suppressions") and len(r["suppressions"]) > 0)
              ]
          with open("semgrep.sarif", "w") as f:
              json.dump(data, f, indent=2)
          '
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
