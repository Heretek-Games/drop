name: ZTNET E2E

on:
  push:
    branches: [develop]
    paths:
      - "server/server/internal/plugins/**"
      - "server/dev-tools/ztnet-bootstrap.mjs"
      - "server/dev-tools/gse-ztnet-check.ts"
      - "server/deploy-template/compose.ztnet.yaml"
      - ".github/workflows/ztnet-e2e.yml"
  pull_request:
    branches: [develop]
    paths:
      - "server/server/internal/plugins/**"
      - "server/dev-tools/ztnet-bootstrap.mjs"
      - "server/dev-tools/gse-ztnet-check.ts"
      - "server/deploy-template/compose.ztnet.yaml"
      - ".github/workflows/ztnet-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ZTNET controller E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXTAUTH_SECRET: ci-only-not-a-secret-${{ github.run_id }}
      # Required by the compose overlay's `drop` service guards; not started.
      GSE_ZTNET_ORG: ci-placeholder
      GSE_ZTNET_TOKEN: ci-placeholder
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Start ZTNET stack
        working-directory: server/deploy-template
        run: |
          docker compose -f compose.yml -f compose.ztnet.yaml \
            up -d ztnet zerotier ztnet-postgres

      - name: Wait for ZTNET
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/auth/ok >/dev/null 2>&1; then
              echo "ZTNET is ready"
              exit 0
            fi
            sleep 3
          done
          echo "::error::ZTNET did not become ready"
          cd server/deploy-template
          docker compose -f compose.yml -f compose.ztnet.yaml logs --no-color
          exit 1

      - name: Bootstrap organization and API token
        env:
          GSE_ZTNET_URL: http://localhost:3001
        run: node server/dev-tools/ztnet-bootstrap.mjs >> "$GITHUB_ENV"

      - name: Run ZTNET backend check
        working-directory: server
        env:
          GSE_ZTNET_URL: http://localhost:3001
        run: pnpm exec jiti dev-tools/gse-ztnet-check.ts

      - name: Tear down
        if: always()
        working-directory: server/deploy-template
        run: docker compose -f compose.yml -f compose.ztnet.yaml down -v
