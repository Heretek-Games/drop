# Toolchain pins for local development and git hooks.
# Install:  mise install
# Docs:     https://mise.jdx.dev
#
# Versions of the lint/security tools match the pins used in CI workflows so
# local hooks and CI agree. Runtime pins mirror the versions in backend/go.work,
# package.json and server/package.json.
[tools]
node = "22"
pnpm = "10.33.0"
python = "3.14"
go = "1.26.6"
rust = "nightly"

shellcheck = "0.11.0" # hooks + analysis CI (shellcheck)
shfmt = "3.14.1"
hadolint = "2.15.1" # analysis CI (hadolint)
actionlint = "1.7.12" # analysis CI (actionlint)
ruff = "0.16.7" # server/dev-tools Python
gitleaks = "8.30.1" # security CI (gitleaks)
typos = "1.50.1"

[tasks.install]
description = "Install toolchain + workspace dependencies"
run = "mise install && pnpm install && pnpm -C desktop/main install"
