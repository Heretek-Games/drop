# golangci-lint v2 configuration.
# Run:  cd backend && golangci-lint run
# CI:   golangci-lint-action@v8 with --new-from-rev=origin/develop (rollout mode).
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - gosec # security-focused linter
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gocognit # cognitive complexity (Sonar S3776 equivalent)
    - gocyclo
    - misspell
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec # test fixtures routinely trip G201/G404 etc.

formatters:
  enable:
    - gofmt
    - goimports
