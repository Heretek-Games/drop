[package]
name = "downpour"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
droplet-rs = { path = "../libraries/droplet" }
fern = { version = "0.7.1", features = ["colored"] }
futures = "0.3.31"
indicatif = "0.18.3"
log = "0.4.29"
opendal = { version = "0.58.2", features = ["services-s3", "services-memory"] }
rand = "0.9.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha2 = "0.10"
walkdir = "2.5"
zstd = "0.13"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt"] }
tokio-util = { version = "0.7.18", features = ["compat"] }

[dev-dependencies]
tempfile = "3"
