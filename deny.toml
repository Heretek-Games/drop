# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run from a crate directory, e.g. `cd torrential && cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# Fail on known vulnerabilities. Add scoped ignores here with a comment and a
# tracking issue if a transitive advisory cannot be resolved immediately.
ignore = []

[licenses]
version = 2
# Permissive/inbound licenses accepted for the dependency graph. The workspace
# itself is AGPL-3.0-only.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
# The workspace intentionally uses "*" for a few crates (tokio, bytes).
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
