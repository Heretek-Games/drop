# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run from a crate directory, e.g. `cd torrential && cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# Only flag unmaintained crates that a workspace directly depends on. The
# transitive unmaintained stack (async-std, instant, unic-*, proc-macro-error,
# GTK-era crates, ...) comes from Tauri/Linux bindings and can only be retired
# upstream; `cargo audit` still reports it weekly in security.yml. Any
# first-party dependency that goes unmaintained must be replaced rather than
# ignored.
unmaintained = "workspace"
# Fail on known vulnerabilities. Add scoped ignores here with a comment and a
# tracking issue if a transitive advisory cannot be resolved immediately.
ignore = [
    # Unmaintained (not vulnerable) advisory for bincode 1.3.3/2.0.1, a direct
    # dependency of the vendored `native_model` crate for its versioned
    # serialization ABI. No safe upgrade exists and swapping the format would
    # break stored/consumed models; revisit when `native_model` migrates.
    { id = "RUSTSEC-2025-0141", reason = "bincode is a direct dependency of the vendored native_model crate" },
]

[licenses]
version = 2
# Permissive/inbound licenses accepted for the dependency graph. The workspace
# itself is AGPL-3.0-only.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
# The workspace intentionally uses "*" for a few crates (tokio, bytes).
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
