[package]
name = "database"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
aes = "0.8.4"
anyhow = "*"
chrono = "0.4.42"
ctr = "0.9.2"
dirs = "6.0.0"
keyring = { version = "3.6.3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
log = "0.4.28"
rand = "0.10.2"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_with = "3.15.0"
url = "2.5.7"
whoami = "1.6.1"

# keyring's linux-native-sync-persistent backend pulls in dbus-secret-service,
# which links against the system dbus-1 via pkg-config. The vendored feature
# builds an in-tree copy of DBus so Linux builds succeed without dbus-devel
# installed. Scoped to Linux because libdbus-sys does not build elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2.7", features = ["vendored"] }

# `keyring` is only referenced from the commented-out KEY_IV block in src/db.rs
# (see the `TODO: fix keyring`), so cargo-machete reports it as unused. Keep the
# dependency until that code is re-enabled instead of re-adding it later.
[package.metadata.cargo-machete]
ignored = ["keyring"]
