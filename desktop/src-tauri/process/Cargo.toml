[package]
name = "process"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
client = { path = "../client", version = "0.1.0" }
database = { path = "../database", version = "0.1.0" }
dynfmt = { version = "0.1.5", features = ["curly"] }
games = { path = "../games", version = "0.1.0" }
gse-engine = { path = "../gse-engine", version = "0.1.0" }
keyvalues-parser = "0.2.3"
log = "0.4.28"
page_size = "0.6.0"
regex = "1.11"
serde = "1.0.228"
serde_json = "1"
serde_with = "3.15.0"
shared_child = "1.1.1"
shell-words = "1.1.1"
tauri = "*"
tauri-plugin-opener = "*"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync"] }
utils = { path = "../utils", version = "0.1.0" }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
