id: org.droposs.client
name: Drop
summary: Self-hosted game distribution and multiplayer platform client
website: https://github.com/Heretek-Games/drop
source_url: https://github.com/Heretek-Games/drop
build:
  manifest: org.droposs.client.yml
  branch: stable
  mode: extra-data
catalog:
  category: Game
  tags:
    - Gaming
    - Launcher
    - Self-Hosted
    - Multiplayer
    - Library
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions:
    - --talk-name=org.freedesktop.Flatpak
    - --device=all
    - --filesystem=host:ro
