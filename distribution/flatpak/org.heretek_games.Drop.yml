app-id: org.heretek_games.Drop
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: drop-desktop-client

finish-args:
  # Display & Audio
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Network connectivity for Drop server sync and downloads
  - --share=network
  # Gamepads and controller input
  - --device=all
  # Allow sub-sandboxing and launching host tools/emulators on SteamOS / Deck
  - --talk-name=org.freedesktop.Flatpak
  # Game directories
  - --filesystem=host:ro
  - --filesystem=xdg-documents:create
  - --filesystem=~/Games:create

modules:
  - name: drop-desktop-client
    buildsystem: simple
    build-commands:
      - install -Dm755 drop-desktop-client /app/bin/drop-desktop-client
      - install -Dm644 org.heretek_games.Drop.desktop /app/share/applications/org.heretek_games.Drop.desktop
      - install -Dm644 org.heretek_games.Drop.metainfo.xml /app/share/metainfo/org.heretek_games.Drop.metainfo.xml
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.heretek_games.Drop.png
    sources:
      - type: file
        path: org.heretek_games.Drop.desktop
      - type: file
        path: org.heretek_games.Drop.metainfo.xml
      - type: file
        path: ../../desktop/src-tauri/icons/128x128.png
        dest-filename: icons/128x128.png
