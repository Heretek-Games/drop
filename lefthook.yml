# Lefthook git hooks for the Drop monorepo.
# Docs: https://lefthook.dev
# Toolchain: mise install (see .mise.toml); scripts/run-tool.sh resolves tools
# from mise and fails with an actionable message rather than skipping a check.
# Escape hatches: git commit/push --no-verify, or LEFTHOOK=0
#
# Commands with a glob that matches no staged files are skipped entirely,
# so e.g. a Markdown-only commit only runs prettier + gitleaks.

pre-commit:
  parallel: true
  commands:
    # Format only staged files, then re-stage them.
    prettier:
      glob: "*.{js,cjs,mjs,ts,tsx,vue,json,jsonc,css,scss,html,yaml,yml,md}"
      exclude:
        - "pnpm-lock.yaml"
        - "**/generated/**"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # Scoped to server/ — the only package with an eslint flat config today.
    # root: makes {staged_files} relative to server/, so the config resolves.
    eslint:
      root: server/
      glob: "server/**/*.{js,cjs,mjs,ts,tsx,vue}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    # Structural lint rules (sgconfig.yml). Warnings only during rollout.
    ast-grep:
      glob: "*.{ts,tsx,vue,go}"
      run: pnpm exec ast-grep scan {staged_files}

    # Shell scripts (pairs with the analysis CI shellcheck job).
    shellcheck:
      glob: "*.{sh,bash}"
      run: scripts/run-tool.sh shellcheck {staged_files}

    # Dockerfile best practices (pairs with the analysis CI hadolint job).
    hadolint:
      glob: "Dockerfile*"
      run: scripts/run-tool.sh hadolint {staged_files}

    # GitHub Actions workflows (pairs with the analysis CI actionlint job).
    actionlint:
      glob: "**/.github/workflows/*.{yml,yaml}"
      run: scripts/run-tool.sh actionlint {staged_files}

    # Python dev tooling: lint + format (ruff is the source of truth).
    ruff:
      glob: "*.py"
      run: scripts/run-tool.sh ruff check --fix {staged_files} && scripts/run-tool.sh ruff format {staged_files}
      stage_fixed: true

    # Dependency versions are pinned in .mise.toml, not installed per commit.
    typos:
      run: scripts/run-tool.sh typos {staged_files}

    # Secret scan on the diff about to be committed. CI enforces too (security.yml).
    gitleaks:
      run: scripts/run-tool.sh gitleaks protect --staged --redact --verbose

commit-msg:
  commands:
    # Conventional Commits (AGENTS.md §7).
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    # Whole-project typecheck; gated on any server TS/Vue change.
    typecheck:
      root: server/
      glob: "server/**/*.{ts,tsx,vue}"
      run: pnpm run typecheck

    # Full server lint (eslint + prettier), matching the server-ci lint job.
    server-lint:
      glob: "server/**/*.{js,cjs,mjs,ts,tsx,vue}"
      run: pnpm -C server run lint

    # Per-crate fmt + clippy over changed crates only (-D warnings, matching CI).
    # desktop/src-tauri is excluded locally (needs Tauri system libs); CI covers it.
    rust:
      glob: "*.rs"
      run: ./scripts/clippy-changed.sh

    # New-issues-only during rollout: backend/ has never been linted before.
    # Compares against origin/develop; remove --new-from-rev once clean.
    golangci-lint:
      root: backend/
      glob: "backend/**/*.go"
      run: |
        base="$(git rev-parse --verify origin/develop 2>/dev/null || echo "")"
        if [ -n "$base" ]; then
          golangci-lint run --new-from-rev="$base" ./core/...
        else
          golangci-lint run ./core/...
        fi

    # Report-only by design (rollout phase): prints findings, never fails.
    # Promotion to blocking is tracked in AGENTS.md (needs export triage).
    knip:
      run: pnpm exec knip --reporter compact || true

    # Early local signal from the Sonar engine; the remote analysis (and its
    # 30-day new-code gate) remains authoritative. Never blocks the push.
    sonar:
      glob: "**/*.{js,cjs,mjs,ts,tsx,vue,py,sh,bash,yml,yaml,go,rs}"
      run: |
        sonar_bin="$(command -v sonar || true)"
        if [ -z "$sonar_bin" ] && [ -x "/home/linuxbrew/.linuxbrew/bin/sonar" ]; then
          sonar_bin="/home/linuxbrew/.linuxbrew/bin/sonar"
        fi
        if [ -z "$sonar_bin" ]; then
          echo "sonar: CLI not installed locally; remote analysis is authoritative"
          exit 0
        fi
        if [ ! -f "$HOME/.config/sonar/env" ]; then
          echo "sonar: not authenticated locally (missing ~/.config/sonar/env); skipping"
          exit 0
        fi
        # shellcheck disable=SC1091
        . "$HOME/.config/sonar/env"
        "$sonar_bin" analyze --base origin/develop --force -p Heretek-Games_drop || true
