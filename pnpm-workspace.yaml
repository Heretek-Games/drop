packages:
  - "server/"
  - "libraries/base/"
  - "sites/*"
  - "desktop/"

# Supply-chain hardening: refuse trust downgrades, ignore packages published
# less than 7 days ago (10080 minutes) and block exotic (git/tarball/path)
# transitive dependencies.
trustPolicy: no-downgrade
# Skip trust evidence comparisons for releases older than one year: they
# predate widespread provenance adoption and trip false positives
# (e.g. @oxc-parser/binding-*@0.70.0, published 2025-05 without provenance).
trustPolicyIgnoreAfter: 525600
minimumReleaseAge: 10080
# Exemptions for lockfile-pinned versions published on 2026-09-09, inside the
# 7-day window. Drop them once those versions have aged out of the window.
minimumReleaseAgeExclude:
  - rolldown@1.2.8
  - "@rolldown/binding-android-arm-eabi@1.2.8"
  - "@rolldown/binding-android-arm64@1.2.8"
  - "@rolldown/binding-darwin-arm64@1.2.8"
  - "@rolldown/binding-darwin-x64@1.2.8"
  - "@rolldown/binding-freebsd-x64@1.2.8"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.8"
  - "@rolldown/binding-linux-arm64-gnu@1.2.8"
  - "@rolldown/binding-linux-arm64-musl@1.2.8"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.8"
  - "@rolldown/binding-linux-s390x-gnu@1.2.8"
  - "@rolldown/binding-linux-x64-gnu@1.2.8"
  - "@rolldown/binding-linux-x64-musl@1.2.8"
  - "@rolldown/binding-openharmony-arm64@1.2.8"
  - "@rolldown/binding-win32-arm64-msvc@1.2.8"
  - "@rolldown/binding-win32-x64-msvc@1.2.8"
  - "@types/react@19.3.0"
  - "react-dom@19.3.0"
  - "@types/node@26.5.1"
  - "react@19.3.0"
  - "vite@8.3.0"
  - "@types/react-dom@19.3.0"
blockExoticSubdeps: true

onlyBuiltDependencies:
  - "@ast-grep/cli"
  - "@bufbuild/buf"
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
  - contentlayer
  - contentlayer2
  - lefthook
  - protobufjs

