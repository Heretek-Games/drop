services:
  postgres:
    # using alpine image to reduce image size
    image: postgres:alpine
    healthcheck:
      test: pg_isready -d drop -U drop
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 10s
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=drop
      - POSTGRES_USER=drop
      - POSTGRES_DB=drop
  drop:
    image: ghcr.io/drop-oss/drop:nightly
    stdin_open: true
    tty: true
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - ./library:/library
      - ./data:/data
      # Optional: mount a fast local tier (SSD/NVMe/tmpfs) for the depot
      # read-through chunk cache. Leave commented out to keep the cache off.
      # - /mnt/fast-block:/fast-block
    environment:
      - DATABASE_URL=postgres://drop:drop@postgres:5432/drop
      # Optional depot chunk cache (requires CHUNK_CACHE_DIR and the matching
      # volume mount above). Content-addressed, best-effort, disabled by
      # default; defaults to 20 GiB when CHUNK_CACHE_MAX_BYTES is unset and
      # verifies each chunk's SHA-256 before caching it.
      # - CHUNK_CACHE_DIR=/fast-block/drop-chunk-cache
      # - CHUNK_CACHE_MAX_BYTES=500000000000
